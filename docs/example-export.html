432_0e2834":{"path":".mltree/runs/r_261023104432_0e2834/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:32Z"},"r_261023104429_f3b5cb":{"path":".mltree/runs/r_261023104429_f3b5cb/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_715c06":{"path":".mltree/runs/r_261023104429_715c06/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_498dc0":{"path":".mltree/runs/r_261023104429_498dc0/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_414289":{"path":".mltree/runs/r_261023104429_414289/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_4418d5":{"path":".mltree/runs/r_261023104429_4418d5/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_887962":{"path":".mltree/runs/r_261023104429_887962/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104429_58abce":{"path":".mltree/runs/r_261023104429_58abce/script.py","sha256":"7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275","created_at":"2026-10-23T10:44:29Z"},"r_261023104434_cfa637":{"path":".mltree/runs/r_261023104434_cfa637/script.py","sha256":"7c75313476d4500f110da5035d7d457d46d00bdf63e320d55aacc5a13bd86ede","created_at":"2026-10-23T10:44:34Z"},"r_261023104429_ca55cc":{"path":".mltree/runs/r_261023104429_ca55cc/script.py","sha256":"7c75313476d4500f110da5035d7d457d46d00bdf63e320d55aacc5a13bd86ede","created_at":"2026-10-23T10:44:29Z"}},"blobs":{"6b08ee293891233beb9aa84aab1a61b58746da3b6e36a727c1e03485c14bf44b":"\"\"\"Step 1 - load SMILES and target values from data/molecules.csv.\"\"\"\nimport csv\n\nfrom _common import DATA, save\n\nrows = []\nwith open(DATA / \"molecules.csv\", newline=\"\") as fh:\n    for r in csv.DictReader(fh):\n        if r[\"smiles\"].strip():\n            rows.append({\"smiles\": r[\"smiles\"].strip(), \"y\": float(r[\"y\"])})\nsave(\"molecules.json\", rows)\nprint(f\"loaded {len(rows)} molecules\")\n","10a08b663528614ef0034f5a68861f93d66013d4422fefece4e37e3ad6fb4712":"\"\"\"Step 2 - turn SMILES into molecular graphs (node features + edge list).\n\nUses RDKit when it is installed; otherwise a tiny regex tokenizer that is good\nenough for the toy dataset (it handles chains, branches, ring closures and\naromatic lowercase atoms, but not stereo or charges).\n\"\"\"\nimport re\n\nfrom _common import load, save\n\nELEMENTS = [\"C\", \"N\", \"O\", \"Cl\", \"S\", \"F\"]\n\n\ndef one_hot(sym: str, aromatic: bool) -> list[float]:\n    v = [1.0 if sym == e else 0.0 for e in ELEMENTS]\n    return v + [1.0 if aromatic else 0.0]\n\n\ndef toy_graph(smiles: str) -> dict:\n    tokens = re.findall(r\"Cl|Br|[BCNOSPF]|[cnos]|\\(|\\)|=|#|\\d\", smiles)\n    nodes, edges, stack, rings = [], [], [], {}\n    prev, order = None, 1\n    for t in tokens:\n        if t == \"(\":\n            stack.append(prev)\n        elif t == \")\":\n            prev = stack.pop()\n        elif t in \"=#\":\n            order = 2 if t == \"=\" else 3\n        elif t.isdigit():\n            if t in rings:\n                edges.append((rings.pop(t), prev, 1))\n            else:\n                rings[t] = prev\n        else:\n            idx = len(nodes)\n            nodes.append(one_hot(t.capitalize() if t != \"Cl\" else t, t.islower()))\n            if prev is not None:\n                edges.append((prev, idx, order))\n            prev, order = idx, 1\n    return {\"x\": nodes, \"edges\": edges}\n\n\ndef rdkit_graph(smiles: str) -> dict:\n    from rdkit import Chem  # noqa: PLC0415\n\n    mol = Chem.MolFromSmiles(smiles)\n    x = [one_hot(a.GetSymbol(), a.GetIsAromatic()) for a in mol.GetAtoms()]\n    e = [(b.GetBeginAtomIdx(), b.GetEndAtomIdx(), int(b.GetBondTypeAsDouble())) for b in mol.GetBonds()]\n    return {\"x\": x, \"edges\": e}\n\n\ntry:\n    import rdkit  # noqa: F401\n\n    to_graph = rdkit_graph\nexcept ImportError:\n    to_graph = toy_graph\n\ngraphs = []\nfor m in load(\"molecules.json\"):\n    g = to_graph(m[\"smiles\"])\n    g.update(smiles=m[\"smiles\"], y=m[\"y\"])\n    graphs.append(g)\nsave(\"graphs.json\", graphs)\nprint(f\"featurized {len(graphs)} graphs with {to_graph.__name__}\")\n","11f0d9bef708b9567390cff3f50a4c879a0b22ea7970c340e34de8a957866ba7":"\"\"\"Step 3 - random train/test split.  Usage: python split.py [test_size] [seed]\"\"\"\nimport random\nimport sys\n\nfrom _common import load, save\n\ntest_size = float(sys.argv[1]) if len(sys.argv) > 1 else 0.2\nseed = int(sys.argv[2]) if len(sys.argv) > 2 else 42\n\ngraphs = load(\"graphs.json\")\nidx = list(range(len(graphs)))\nrandom.Random(seed).shuffle(idx)\nn_test = max(1, round(len(idx) * test_size))\nsave(\"test.json\", [graphs[i] for i in idx[:n_test]])\nsave(\"train.json\", [graphs[i] for i in idx[n_test:]])\nprint(f\"train={len(idx) - n_test} test={n_test} seed={seed}\")\n","7bc6a3a3c7815bb01ae18f704001face4a954b0b283025267918fe2898b08275":"\"\"\"Step 4 - train a toy 'GCN': one round of mean neighbour aggregation, sum pooling,\nthen ridge regression on the pooled features (closed form, stdlib only).\n\nSwap this file for a real PyTorch Geometric GCN later; the node in the map stays the same.\nUsage: python train.py [alpha]\n\"\"\"\nimport sys\n\nfrom _common import embed, load, save\n\nalpha = float(sys.argv[1]) if len(sys.argv) > 1 else 1.0\n\n\ndef solve(A: list[list[float]], b: list[float]) -> list[float]:\n    n = len(b)\n    M = [row[:] + [b[i]] for i, row in enumerate(A)]\n    for c in range(n):\n        p = max(range(c, n), key=lambda r: abs(M[r][c]))\n        M[c], M[p] = M[p], M[c]\n        for r in range(n):\n            if r != c and M[c][c]:\n                f = M[r][c] / M[c][c]\n                M[r] = [a - f * bb for a, bb in zip(M[r], M[c])]\n    return [M[i][n] / M[i][i] if M[i][i] else 0.0 for i in range(n)]\n\n\ntrain = load(\"train.json\")\nX = [embed(g) for g in train]\ny = [g[\"y\"] for g in train]\nd = len(X[0])\nXtX = [[sum(r[i] * r[j] for r in X) + (alpha if i == j else 0.0) for j in range(d)] for i in range(d)]\nXty = [sum(r[i] * t for r, t in zip(X, y)) for i in range(d)]\nw = solve(XtX, Xty)\nsave(\"model.json\", {\"weights\": w, \"alpha\": alpha})\nrmse = (sum((sum(a * b for a, b in zip(r, w)) - t) ** 2 for r, t in zip(X, y)) / len(y)) ** 0.5\nprint(f\"train_rmse={rmse:.3f} alpha={alpha}\")\nprint(f\"MLTREE_METRIC train_rmse={rmse:.4f}\")  # picked up by mltree when the step is run from the map\n","7c75313476d4500f110da5035d7d457d46d00bdf63e320d55aacc5a13bd86ede":"\"\"\"Step 5 - evaluate the trained model on the test split (RMSE, MAE, R2).\"\"\"\nimport json\n\nfrom _common import embed, load, save\n\nmodel = load(\"model.json\")\ntest = load(\"test.json\")\npred = [sum(a * b for a, b in zip(embed(g), model[\"weights\"])) for g in test]\ny = [g[\"y\"] for g in test]\nn = len(y)\nrmse = (sum((p - t) ** 2 for p, t in zip(pred, y)) / n) ** 0.5\nmae = sum(abs(p - t) for p, t in zip(pred, y)) / n\nmean = sum(y) / n\nss_tot = sum((t - mean) ** 2 for t in y) or 1.0\nr2 = 1 - sum((p - t) ** 2 for p, t in zip(pred, y)) / ss_tot\nmetrics = {\"test_rmse\": round(rmse, 4), \"test_mae\": round(mae, 4), \"test_r2\": round(r2, 4)}\nsave(\"metrics.json\", metrics)\nprint(json.dumps(metrics))\nprint(\"MLTREE_METRIC \" + json.dumps(metrics))  # picked up by mltree when the step is run from the map\n"}}</script>
