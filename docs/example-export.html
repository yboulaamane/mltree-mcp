abaa037542f253445f06353db224fc2a4b62d10f2f553d544ffc0847a","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_15fd1e":{"path":".mltree/runs/r_261023112131_15fd1e/script.py","sha256":"11f0d9bef708b9567390cff3f50a4c879a0b22ea7970c340e34de8a957866ba7","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_ecd4d2":{"path":".mltree/runs/r_261023112131_ecd4d2/script.py","sha256":"b3f3f51e9203e47060db59c40cff2883b1ce422bcd92d2a4748704a659ebf881","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_344175":{"path":".mltree/runs/r_261023112131_344175/script.py","sha256":"b3f3f51e9203e47060db59c40cff2883b1ce422bcd92d2a4748704a659ebf881","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_34ea14":{"path":".mltree/runs/r_261023112131_34ea14/script.py","sha256":"e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_35ff8d":{"path":".mltree/runs/r_261023112131_35ff8d/script.py","sha256":"e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_5f7523":{"path":".mltree/runs/r_261023112131_5f7523/script.py","sha256":"e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_6b4b0d":{"path":".mltree/runs/r_261023112131_6b4b0d/script.py","sha256":"e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_7c889a":{"path":".mltree/runs/r_261023112131_7c889a/script.py","sha256":"e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5","created_at":"2026-10-23T11:21:31Z"},"r_261023112131_ca3ac6":{"path":".mltree/runs/r_261023112131_ca3ac6/script.py","sha256":"7c75313476d4500f110da5035d7d457d46d00bdf63e320d55aacc5a13bd86ede","created_at":"2026-10-23T11:21:31Z"}},"blobs":{"6b08ee293891233beb9aa84aab1a61b58746da3b6e36a727c1e03485c14bf44b":"\"\"\"Step 1 - load SMILES and target values from data/molecules.csv.\"\"\"\nimport csv\n\nfrom _common import DATA, save\n\nrows = []\nwith open(DATA / \"molecules.csv\", newline=\"\") as fh:\n    for r in csv.DictReader(fh):\n        if r[\"smiles\"].strip():\n            rows.append({\"smiles\": r[\"smiles\"].strip(), \"y\": float(r[\"y\"])})\nsave(\"molecules.json\", rows)\nprint(f\"loaded {len(rows)} molecules\")\n","bdde4adabaa037542f253445f06353db224fc2a4b62d10f2f553d544ffc0847a":"\"\"\"Step 2 - turn SMILES into molecular graphs (node features + edge list).\n\nUses RDKit when it is installed; otherwise a tiny regex tokenizer that is good\nenough for the toy dataset (it handles chains, branches, ring closures and\naromatic lowercase atoms, but not stereo or charges).\n\"\"\"\nimport re\n\nfrom _common import OUT, load, save\n\nELEMENTS = [\"C\", \"N\", \"O\", \"Cl\", \"S\", \"F\"]\n\n\ndef one_hot(sym: str, aromatic: bool) -> list[float]:\n    v = [1.0 if sym == e else 0.0 for e in ELEMENTS]\n    return v + [1.0 if aromatic else 0.0]\n\n\ndef toy_graph(smiles: str) -> dict:\n    tokens = re.findall(r\"Cl|Br|[BCNOSPF]|[cnos]|\\(|\\)|=|#|\\d\", smiles)\n    nodes, edges, stack, rings = [], [], [], {}\n    prev, order = None, 1\n    for t in tokens:\n        if t == \"(\":\n            stack.append(prev)\n        elif t == \")\":\n            prev = stack.pop()\n        elif t in \"=#\":\n            order = 2 if t == \"=\" else 3\n        elif t.isdigit():\n            if t in rings:\n                edges.append((rings.pop(t), prev, 1))\n            else:\n                rings[t] = prev\n        else:\n            idx = len(nodes)\n            nodes.append(one_hot(t.capitalize() if t != \"Cl\" else t, t.islower()))\n            if prev is not None:\n                edges.append((prev, idx, order))\n            prev, order = idx, 1\n    return {\"x\": nodes, \"edges\": edges}\n\n\ndef rdkit_graph(smiles: str) -> dict:\n    from rdkit import Chem  # noqa: PLC0415\n\n    mol = Chem.MolFromSmiles(smiles)\n    x = [one_hot(a.GetSymbol(), a.GetIsAromatic()) for a in mol.GetAtoms()]\n    e = [(b.GetBeginAtomIdx(), b.GetEndAtomIdx(), int(b.GetBondTypeAsDouble())) for b in mol.GetBonds()]\n    return {\"x\": x, \"edges\": e}\n\n\ntry:\n    import rdkit  # noqa: F401\n\n    to_graph = rdkit_graph\nexcept ImportError:\n    to_graph = toy_graph\n\ngraphs = []\nfor m in load(\"molecules.json\"):\n    g = to_graph(m[\"smiles\"])\n    g.update(smiles=m[\"smiles\"], y=m[\"y\"])\n    graphs.append(g)\nsave(\"graphs.json\", graphs)\nprint(f\"featurized {len(graphs)} graphs with {to_graph.__name__}\")\n\ntry:  # also write a PyTorch Geometric dataset when torch_geometric is installed\n    import torch\n    from torch_geometric.data import Data, InMemoryDataset\nexcept ImportError:\n    pass\nelse:\n    def to_data(g: dict) -> Data:\n        pairs = [(a, b) for a, b, _ in g[\"edges\"]] + [(b, a) for a, b, _ in g[\"edges\"]]\n        edge_index = torch.tensor(pairs, dtype=torch.long).t().reshape(2, -1)\n        return Data(x=torch.tensor(g[\"x\"]), edge_index=edge_index, y=torch.tensor([g[\"y\"]]))\n\n    data, slices = InMemoryDataset.collate([to_data(g) for g in graphs])\n    torch.save((data.to_dict(), slices), OUT / \"graphs.pt\")\n    print(\"wrote data/processed/graphs.pt (PyG)\")\n","11f0d9bef708b9567390cff3f50a4c879a0b22ea7970c340e34de8a957866ba7":"\"\"\"Step 3 - random train/test split.  Usage: python split.py [test_size] [seed]\"\"\"\nimport random\nimport sys\n\nfrom _common import load, save\n\ntest_size = float(sys.argv[1]) if len(sys.argv) > 1 else 0.2\nseed = int(sys.argv[2]) if len(sys.argv) > 2 else 42\n\ngraphs = load(\"graphs.json\")\nidx = list(range(len(graphs)))\nrandom.Random(seed).shuffle(idx)\nn_test = max(1, round(len(idx) * test_size))\nsave(\"test.json\", [graphs[i] for i in idx[:n_test]])\nsave(\"train.json\", [graphs[i] for i in idx[n_test:]])\nprint(f\"train={len(idx) - n_test} test={n_test} seed={seed}\")\n","b3f3f51e9203e47060db59c40cff2883b1ce422bcd92d2a4748704a659ebf881":"\"\"\"Step 4 - train a toy 'GCN': one round of mean neighbour aggregation, sum pooling,\nthen ridge regression on the pooled features (closed form, stdlib only).\n\nSwap this file for a real PyTorch Geometric GCN later; the node in the map stays the same.\nUsage: python train.py [alpha]\n\"\"\"\nimport sys\n\nfrom _common import embed, load, save\n\nalpha = float(sys.argv[1]) if len(sys.argv) > 1 else 1.0\nhidden = 64\n\ntry:  # the real PyG model (see gcn_model.py); the toy ridge regression below runs without torch\n    from gcn_model import MolGCN\n\n    model = MolGCN(hidden_channels=hidden, num_layers=3)\n    print(f\"MolGCN: {sum(p.numel() for p in model.parameters())} parameters (not trained by this toy step)\")\nexcept ImportError:\n    model = None\n\n\ndef solve(A: list[list[float]], b: list[float]) -> list[float]:\n    n = len(b)\n    M = [row[:] + [b[i]] for i, row in enumerate(A)]\n    for c in range(n):\n        p = max(range(c, n), key=lambda r: abs(M[r][c]))\n        M[c], M[p] = M[p], M[c]\n        for r in range(n):\n            if r != c and M[c][c]:\n                f = M[r][c] / M[c][c]\n                M[r] = [a - f * bb for a, bb in zip(M[r], M[c])]\n    return [M[i][n] / M[i][i] if M[i][i] else 0.0 for i in range(n)]\n\n\ntrain = load(\"train.json\")\nX = [embed(g) for g in train]\ny = [g[\"y\"] for g in train]\nd = len(X[0])\nXtX = [[sum(r[i] * r[j] for r in X) + (alpha if i == j else 0.0) for j in range(d)] for i in range(d)]\nXty = [sum(r[i] * t for r, t in zip(X, y)) for i in range(d)]\nw = solve(XtX, Xty)\nsave(\"model.json\", {\"weights\": w, \"alpha\": alpha})\nrmse = (sum((sum(a * b for a, b in zip(r, w)) - t) ** 2 for r, t in zip(X, y)) / len(y)) ** 0.5\nprint(f\"train_rmse={rmse:.3f} alpha={alpha}\")\nprint(f\"MLTREE_METRIC train_rmse={rmse:.4f}\")  # picked up by mltree when the step is run from the map\n","e520690ef56a63ad8792513d17b29620d069d3202f9551dc4a63c66976ec4ed5":"\"\"\"Step 4 - train a toy 'GCN': one round of mean neighbour aggregation, sum pooling,\nthen ridge regression on the pooled features (closed form, stdlib only).\n\nSwap this file for a real PyTorch Geometric GCN later; the node in the map stays the same.\nUsage: python train.py [alpha]\n\"\"\"\nimport sys\n\nfrom _common import embed, load, save\n\nalpha = float(sys.argv[1]) if len(sys.argv) > 1 else 1.0\nhidden = 64\n\ntry:  # the real PyG model (see gcn_model.py); the toy ridge regression below runs without torch\n    from gcn_model import MolGCN\n\n    model = MolGCN(hidden_channels=hidden, num_layers=3)\n    print(f\"MolGCN: {sum(p.numel() for p in model.parameters())} parameters (not trained by this toy step)\")\nexcept ImportError:\n    model = None\n\n\ndef solve(A: list[list[float]], b: list[float]) -> list[float]:\n    n = len(b)\n    M = [row[:] + [b[i]] for i, row in enumerate(A)]\n    for c in range(n):\n        p = max(range(c, n), key=lambda r: abs(M[r][c]))\n        M[c], M[p] = M[p], M[c]\n        for r in range(n):\n            if r != c and M[c][c]:\n                f = M[r][c] / M[c][c]\n                M[r] = [a - f * bb for a, bb in zip(M[r], M[c])]\n    return [M[i][n] / M[i][i] if M[i][i] else 0.0 for i in range(n)]\n\n\ntrain = load(\"train.json\")\nX = [embed(g) for g in train]\ny = [g[\"y\"] for g in train]\nd = len(X[0])\nXtX = [[sum(r[i] * r[j] for r in X) + (alpha if i == j else 0.0) for j in range(d)] for i in range(d)]\nXty = [sum(r[i] * t for r, t in zip(X, y)) for i in range(d)]\nw = solve(XtX, Xty)\nsave(\"model.json\", {\"weights\": w, \"alpha\": alpha})\nrmse = (sum((sum(a * b for a, b in zip(r, w)) - t) ** 2 for r, t in zip(X, y)) / len(y)) ** 0.5\nprint(f\"train_rmse={rmse:.3f} alpha={alpha}\")\n","7c75313476d4500f110da5035d7d457d46d00bdf63e320d55aacc5a13bd86ede":"\"\"\"Step 5 - evaluate the trained model on the test split (RMSE, MAE, R2).\"\"\"\nimport json\n\nfrom _common import embed, load, save\n\nmodel = load(\"model.json\")\ntest = load(\"test.json\")\npred = [sum(a * b for a, b in zip(embed(g), model[\"weights\"])) for g in test]\ny = [g[\"y\"] for g in test]\nn = len(y)\nrmse = (sum((p - t) ** 2 for p, t in zip(pred, y)) / n) ** 0.5\nmae = sum(abs(p - t) for p, t in zip(pred, y)) / n\nmean = sum(y) / n\nss_tot = sum((t - mean) ** 2 for t in y) or 1.0\nr2 = 1 - sum((p - t) ** 2 for p, t in zip(pred, y)) / ss_tot\nmetrics = {\"test_rmse\": round(rmse, 4), \"test_mae\": round(mae, 4), \"test_r2\": round(r2, 4)}\nsave(\"metrics.json\", metrics)\nprint(json.dumps(metrics))\nprint(\"MLTREE_METRIC \" + json.dumps(metrics))  # picked up by mltree when the step is run from the map\n"},"histories":{"r_261023112131_344175":[{"epoch":1,"train_loss":1.145,"val_rmse":1.4362,"step":1},{"epoch":2,"train_loss":1.0335,"val_rmse":1.3019,"step":2},{"epoch":3,"train_loss":0.9414,"val_rmse":1.1917,"step":3},{"epoch":4,"train_loss":0.8651,"val_rmse":1.1014,"step":4},{"epoch":5,"train_loss":0.8019,"val_rmse":1.0274,"step":5},{"epoch":6,"train_loss":0.7493,"val_rmse":0.9666,"step":6},{"epoch":7,"train_loss":0.7055,"val_rmse":0.9168,"step":7},{"epoch":8,"train_loss":0.6688,"val_rmse":0.876,"step":8},{"epoch":9,"train_loss":0.638,"val_rmse":0.8425,"step":9},{"epoch":10,"train_loss":0.6121,"val_rmse":0.8151,"step":10},{"epoch":11,"train_loss":0.5901,"val_rmse":0.7926,"step":11},{"epoch":12,"train_loss":0.5713,"val_rmse":0.7741,"step":12},{"epoch":13,"train_loss":0.5552,"val_rmse":0.759,"step":13},{"epoch":14,"train_loss":0.5412,"val_rmse":0.7466,"step":14},{"epoch":15,"train_loss":0.5291,"val_rmse":0.7364,"step":15},{"epoch":16,"train_loss":0.5184,"val_rmse":0.728,"step":16},{"epoch":17,"train_loss":0.5089,"val_rmse":0.7212,"step":17},{"epoch":18,"train_loss":0.5005,"val_rmse":0.7156,"step":18},{"epoch":19,"train_loss":0.4928,"val_rmse":0.711,"step":19},{"epoch":20,"train_loss":0.4858,"val_rmse":0.7072,"step":20},{"epoch":21,"train_loss":0.4793,"val_rmse":0.7041,"step":21},{"epoch":22,"train_loss":0.4732,"val_rmse":0.7016,"step":22},{"epoch":23,"train_loss":0.4676,"val_rmse":0.6995,"step":23},{"ep
