[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mltree-mcp"
version = "0.1.0"
description = "An MCP server that maps your ML / GNN workflow as a node graph and records every experiment as a branching tree, while Codex or Claude Code works."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yassir Boulaamane" }]
keywords = ["mcp", "machine-learning", "gnn", "experiment-tracking", "claude-code", "codex", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  # Works with the 1.x SDK (FastMCP) and the 2.x SDK (MCPServer).
  "mcp>=1.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]

[project.scripts]
mltree-mcp = "mltree_mcp.server:main"

[project.urls]
Homepage = "https://github.com/yboulaamane/mltree-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/mltree_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
